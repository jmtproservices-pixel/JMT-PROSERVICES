name: Deploy JMT Music Label

on:
  push:
    branches: [main]
    paths:
      - 'music-label/**'
      - '.github/workflows/deploy-music-label.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-music-label
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the music-label website
        uses: actions/upload-pages-artifact@v3
        with:
          path: music-label
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
